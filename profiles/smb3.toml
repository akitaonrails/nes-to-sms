# Player_DrawAndDoActions29: non-pipe code at physical29:D3EC jumps to
# physical8:A224 (68 68 4C 31 A2), dropping its caller before restoring R6.
# The normal pipe return increments Player_InPipe then drops the wrapper's
# caller instead. Both JSR operands and return pairs match the local ROM.
[[return_consume]]
bank = 8
at = 0xa224
calls = [
  { bank = 8, caller = 0xa21e, target = 0xd1ba },
  { bank = 8, caller = 0xa472, target = 0xa216 },
]

# AScrlURDiag_NoWrapAbort skips its caller when no wrap is active or gameplay
# is halted. Local DEB0 bytes AD FE 05 F0 04 A5 CE F0 02 68 68 60 match
# Southbird PRG000_DEB9; both source JSR sites contain 20 B0 DE.
[[return_consume]]
bank = 0
at = 0xdeb9
calls = [
  { bank = 0, caller = 0xde44, target = 0xdeb0 },
  { bank = 0, caller = 0xde94, target = 0xdeb0 },
]

# Level_DoChangeReset restores its two locally pushed scroll bytes, then
# the horizontal initial-object scan drops its caller at BF6D (68 68 60).
# Southbird PRG005_BF49 path and local B7F0 JSR bytes 20 2F BE agree.
[[return_consume]]
bank = 5
at = 0xbf6d
calls = [{ bank = 5, caller = 0xb7f0, target = 0xbe2f }]

# Mushroom raising: PowerUp_DoRaise discards its caller at A93D (68 68 60).
# Native clear-E observed 1:A871 JSR A8C4 (20 C4 A8) 216 times and
# Object_DeleteOffScreen returning to A93D 44 times; live return pair=A873.
[[return_consume]]
bank = 1
at = 0xa93d
calls = [{ bank = 1, caller = 0xa871, target = 0xa8c4 }]


