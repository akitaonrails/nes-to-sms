# Super Mario Bros. 3 (USA) (Rev 1) — experimental cooperative MMC3 conversion.
# Reset/title/world-map progression is verified in the emulator at 500% clock.
# The declared wait boundaries adapt frame scheduling; this is not cycle-exact
# MMC3 IRQ emulation or a claim of complete gameplay. See docs/smb3-plan.md.
# The payload hash covers PRG followed by CHR, excluding the NES header.
[rom]
name = "Super Mario Bros. 3 (USA) (Rev 1)"
mapper = 4
prg_kib = 256
chr_kib = 128
payload_sha256 = "959fdd32c71735d6fb2bd16a646d39f4ee65623273dd035e6a968e991bd13ef8"


