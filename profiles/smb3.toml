[input]
mode = "action"
pause_start = true
# Start requires the SMS Pause button. Holding A+B remains run+jump;
# the legacy two-button Start shortcut is disabled in the full MMC3 runtime.

[translation]
runtime_defines = ["MMC3_FULL_RUNTIME", "SMB3_MMC3_SINGLE_SPLIT"]

# Original polling bodies remain translated. Native title/map/level census:
# only these two wait loops; first startup wait has I set with rendering off.
[[cooperative_wait]]
bank = 24
at = 0xa81c
tick = 0x10
tick_enable = 0x1c

[[cooperative_wait]]
bank = 30
at = 0x96fb
tick = 0x10
tick_enable = 0x1c

