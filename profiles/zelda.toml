# The Legend of Zelda (USA) — MMC1 (mapper 1), 128 KiB PRG, 8 KiB CHR-RAM, battery.
# PRG mode 3: $8000-$BFFF switchable 16K, $C000-$FFFF fixed to last bank (UxROM-like geometry).
