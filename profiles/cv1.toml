# This fixed-bank table deliberately contains switchable-window addresses.
# Unqualified L_8xxx labels mean "the currently selected UxROM bank" and are
# lowered through the runtime's bank-aware tail dispatcher.
# The JSR $CA6D caller pushes a $F3/$7C return pair the dispatched handler's
# RTS pops to resume at $F37D, so every case needs the stack-aware
# continuation frame (stack_return_bytes = 2); no case self-consumes the
# pair, so tail_indices stays empty.
