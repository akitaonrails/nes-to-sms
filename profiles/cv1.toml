# Castlevania (USA) (Rev 1) — mapper-2 (UxROM) stress target for the
# mapper phase (docs/mapper-plan.md M1). CHR is RAM (chr_kib = 0):
# tiles upload at runtime through $2007.
[rom]
name    = "Castlevania"
mapper  = 2
prg_kib = 128
chr_kib = 0
payload_sha256 = "7eba1637cd2fdbc4f0732eb5249e32d827dbdadbd7e165f961440af4310880dc"

[render]
scroll_split = false     # no line IRQs: GPGX line-pending storm starved the game
# The translated coarse PPU schedule leaves CV1's title-transition fill tiles
# $37/$38 in the top status band. Remap them only while projecting those rows;
# raw CIRAM and playfield rows remain authoritative.
top_tile_remap_rows = 8
top_tile_remap_from = [0x37, 0x38]
top_tile_remap_to = 0x00
# Full-screen rebuilds reclaim the 256-slot variant cache, so CV1's largest
# observed visible working set (234 tile/subpalette pairs) fits without the
# shape-only identity fallback. Keep normal attribute-driven palette variants.
chr_ram_bg_identity = false

[input]
mode = "action"          # button 1 = NES A (jump), button 2 = NES B (whip)
pause_start = true       # SMS PAUSE button = NES Start (title start / pause)

[vectors]
nmi   = 0xc052
reset = 0xc008
irq   = 0xc0bf

[translation]
runtime_defines = ["CV1_RUNTIME_HOOKS"]

# The full NMI finishes DMA/stripe/split setup through this routine before
# setting busy $1B. Lag callers keep the PPU semantics but do not publish.
[[replacement]]
addr = 0xc11f
runtime_label = "rt_cv1_scroll_publish"
reason = "Preserve scroll/control writes and publish the completed graphics prologue once"

# Trap-driven bank annotations (see out/cv1/reports/unresolved_labels.txt
# + $CB62 shadow at trap time).
[[function]]
addr = 0xedf3
name = "func_EDF3"

[[function]]
addr = 0xc368
name = "func_C368"

# Fixed-bank shared object-timer tail. The object handler at $DE32 branches
# backward to the real BEQ instruction at $DE04; without this root the valid
# path reached a strict unresolved stub when a broken candle spawned an item.
