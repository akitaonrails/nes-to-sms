# Super Mario Bros. profile for the nes-to-sms pipeline.
#
# Function and label entries are auto-imported from the doppelganger
# SMB disassembly (https://6502disassembly.com/nes-smb/). Functions
# are labels that appear as JSR targets OR as .dd2 dispatch entries
# (JumpEngine pattern). Data regions are extracted from .bulk/.dd1/
# .dd2/.byte/.word directives.

[rom]
name    = "Super Mario Bros."
mapper  = 0
prg_kib = 32
chr_kib = 8

[vectors]
nmi   = 0x8082
reset = 0x8000
irq   = 0xfff0

[[chr_pack]]
table = 1
start = 0x00
end = 0xff
dest = 0

# Sprite patterns (NES pattern table 0) -> SMS slots $100-$1A6 (256-422).
# 224-line mode moves the name table to $3700 (= slot 440), so only sprite
# slots up to 439 are valid VRAM. Reserved layout within 256-439:
#   256-422  packed sprite patterns ($00-$A6)
#   423      blank/transparent tile (unpacked = zero); unmapped sprite tiles
#            fall back here (see build_chr_maps, BLANK_SPRITE_VALUE = 167).
#   424-439  16 scratch slots the runtime rewrites each frame to emulate the
#            horizontal/vertical sprite flips the SMS VDP can't do in hardware
#            (runtime/sat.s rt_sat_resolve / do_flip).
# NES sprite tile $FC (SMB's blank/transparent tile) isn't packed, so it
# resolves to the blank slot. Sprite tiles $A7-$FF don't fit and fall back to
# transparent (high-range graphics: score popups, flag, etc.).
[[chr_pack]]
table = 0
start = 0x00
end = 0xa6
dest = 0x100

