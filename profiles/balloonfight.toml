# Balloon Fight (USA) — NROM-128 (mapper 0, 16 KiB PRG, 8 KiB CHR).
# Minimal profile for the generality test: no game-specific knowledge;
# vectors from the ROM, discovery carries the rest.

[rom]
name    = "Balloon Fight"
mapper  = 0
prg_kib = 32
chr_kib = 8

[vectors]
nmi   = 0xC094
reset = 0xC000
irq   = 0xC0F7

[[chr_pack]]
table = 0
start = 0x00
end = 0xff
dest = 0

# Indirect-dispatch (JMP ($0025)) handler roots — the analyzer sees these
# as external targets it cannot reach statically; declaring them roots lets
# the computed-dispatch runtime reach them.
[[function]]
addr = 0xF500
name = "handler_F500"

